<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-5">

            <p class="text-primary fw-bold">
                STUDENT PORTAL
            </p>

            <h1>
                Student Management System
            </h1>

            <p class="text-muted">
                Manage student information easily and efficiently.
            </p>

        </div>


        <!-- Student Form -->
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">

            <div class="card-body p-4">

                <h3 class="mb-4">
                    Add Student
                </h3>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            class="form-control"
                            placeholder="Enter student name"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="rollNumber"
                            class="form-control"
                            placeholder="Enter roll number"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            class="form-control"
                            placeholder="Enter course"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter email"
                        >

                    </div>


                    <div class="col-12">

                        <button
                            id="addStudentBtn"
                            class="btn btn-primary w-100"
                        >
                            + Add Student
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Statistics -->
<div class="stats">

    <div class="stat-box">
        <div class="stat-number" id="totalStudents">0</div>
        <div class="stat-label">Total Students</div>
    </div>

    <div class="stat-box">
        <div class="stat-number" id="cseStudents">0</div>
        <div class="stat-label">CSE Students</div>
    </div>

    <div class="stat-box">
        <div class="stat-number" id="otherStudents">0</div>
        <div class="stat-label">Other Courses</div>
    </div>

</div>


        <!-- Student List -->
        <div class="card shadow-sm mx-auto mt-4" style="max-width: 900px;">

            <div class="card-body p-4">

                <h3 class="mb-4">
                    Student Records
                </h3>

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>
                                <th>Name</th>
                                <th>Roll No.</th>
                                <th>Course</th>
                                <th>Email</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="studentList">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- Back to Portfolio -->
        <div class="text-center mt-4">

            <a href="../index.html" class="btn btn-outline-primary">
                ← Back to Portfolio
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
