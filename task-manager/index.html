<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="task-card">

            <!-- TOP -->
            <div class="top-bar">
                <div class="brand">
                    <div class="brand-icon">✓</div>

                    <div>
                        <span>MY PRODUCTIVITY</span>
                        <h1>Task Manager</h1>
                    </div>
                </div>

                <a href="../index.html" class="back-btn">
                    ← Portfolio
                </a>
            </div>


            <!-- INTRO -->
            <div class="intro">
                <p>Plan your day. Complete your goals.</p>
            </div>


            <!-- ADD TASK -->
            <div class="add-task">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    + Add Task
                </button>

            </div>


            <!-- STATS -->
            <div class="stats">

                <div class="stat-box">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>

                <div class="stat-box completed-box">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>

                <div class="stat-box">
                    <div class="stat-number" id="remainingTasks">0</div>
                    <div class="stat-label">Remaining</div>
                </div>

            </div>


            <!-- TASK SECTION -->
            <div class="task-section">

                <div class="section-heading">
                    <div>
                        <span class="mini-title">YOUR LIST</span>
                        <h2>Today's Tasks</h2>
                    </div>

                    <span id="taskCount" class="task-count">
                        0 tasks
                    </span>
                </div>


                <ul id="taskList"></ul>

                <div id="emptyMessage" class="empty-message">
                    <div class="empty-icon">✓</div>
                    <h3>No tasks yet</h3>
                    <p>Add something you want to accomplish today.</p>
                </div>

            </div>


            <!-- FOOTER -->
            <div class="footer-message">
                <span>✦</span>
                Stay focused. You've got this.
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
