<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our own CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">

        <div class="card mx-auto shadow" style="max-width: 400px;">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Smart Calculator
                </h2>
                <a href="../index.html" class="btn btn-outline-primary mb-3">
    ← Back to Portfolio
</a>
                <input type="text" id="display" class="form-control text-end mb-3" value="0" readonly>
                <div class="row g-2">

    <div class="col-3">
        <button class="btn btn-secondary w-100">7</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">8</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">9</button>
    </div>

    <div class="col-3">
        <button class="btn btn-primary w-100">÷</button>
    </div>


    <div class="col-3">
        <button class="btn btn-secondary w-100">4</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">5</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">6</button>
    </div>

    <div class="col-3">
        <button class="btn btn-primary w-100">×</button>
    </div>


    <div class="col-3">
        <button class="btn btn-secondary w-100">1</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">2</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">3</button>
    </div>

    <div class="col-3">
        <button class="btn btn-primary w-100">−</button>
    </div>


    <div class="col-3">
        <button class="btn btn-danger w-100">C</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">0</button>
    </div>

    <div class="col-3">
        <button class="btn btn-secondary w-100">.</button>
    </div>

    <div class="col-3">
        <button class="btn btn-primary w-100">+</button>
    </div>


    <div class="col-12">
        <button class="btn btn-success w-100">=</button>
    </div>

</div>

            </div>

        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
